format_version: 4
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
  - stamp_path_to_icons: "AppIcon/"
  - stamp_version: "0.1"
  - stamp_build_number: "123"
  # If you want to share this step into a StepLib
  - BITRISE_STEP_ID: bitrise-step-stamp-appicon-with-version-number
  - BITRISE_STEP_VERSION: "1.2.0"
  - BITRISE_STEP_GIT_CLONE_URL: https://github.com/ollitapa/bitrise-step-stamp-appicon-with-version-number.git
  - MY_STEPLIB_REPO_FORK_GIT_URL: https://github.com/ollitapa/bitrise-steplib

workflows:
  test:
    steps:
    - change-workdir:
        title: Switch working dir to test / testing dir
        description: |-
          To prevent step testing issues, like referencing relative
          files with just './some-file' in the step's code, which would
          work for testing the step from this directory directly
          but would break if the step is included in another `bitrise.yml`.
        run_if: true
        inputs:
        - path: ./testing
        - is_create_path: true
    - path::./:
        title: Step Test
        description: |-
          Stamp test icon with version 1.2(123) with default colors.
        run_if: true
        inputs:
        - stamp_path_to_icons: "./AppIcon"
        - stamp_version: "1.2"
        - stamp_build_number: "123"
            
  # ----------------------------------------------------------------
  # --- workflows to Share this step into a Step Library
  audit-this-step:
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            stepman audit --step-yml ./step.yml

  # ----------------------------------------------------------------
  # --- workflow to tag a release with the step version
  tag-this-step:
    description: |-
      Tags the current commit with the version in `step.yml`.

      Authentication: uses `GITHUB_TOKEN` if set, otherwise falls back
      to the Bitrise GitHub App build token in `GIT_HTTP_PASSWORD`
      (requires the app to have extended/full permissions, including
      contents:write). Fails if neither is available.
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            step_version="$(grep -m1 '^version:' step.yml | awk '{print $2}')"
            if [ -z "$step_version" ]; then
              step_version="${BITRISE_STEP_VERSION}"
            fi
            if [ -z "$step_version" ]; then
              echo "Could not read version from step.yml or BITRISE_STEP_VERSION!"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${step_version}" >/dev/null; then
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse "${step_version}^{commit}")" ]; then
                echo "Tag ${step_version} already exists on this commit, skipping tagging."
                exit 0
              else
                echo "Tag ${step_version} already exists on a different commit!"
                exit 1
              fi
            fi
            echo "Tagging release: ${step_version}"
            gh_token="${GITHUB_TOKEN:-${GIT_HTTP_PASSWORD}}"
            if [ -z "$gh_token" ]; then
              echo "No GitHub token found! Set GITHUB_TOKEN or rely on the Bitrise GitHub App token in GIT_HTTP_PASSWORD."
              exit 1
            fi
            repo_slug="$(git remote get-url origin | sed 's#.*github.com[:/]##;s#\.git$##')"
            git config user.name "${GIT_TAG_USER_NAME:-bitrise-step-release}"
            git config user.email "${GIT_TAG_USER_EMAIL:-bot@users.noreply.github.com}"
            git tag -a "${step_version}" -m "Release ${step_version}"
            git push "https://x-access-token:${gh_token}@github.com/${repo_slug}.git" "${step_version}"

  # ----------------------------------------------------------------
  # --- workflow to create a GitHub release for the step version tag
  github-release-this-step:
    description: |-
      Creates a GitHub release for the tag matching the version in
      `step.yml`.

      Authentication: uses `GITHUB_TOKEN` if set, otherwise falls back
      to the Bitrise GitHub App build token in `GIT_HTTP_PASSWORD`
      (requires the app to have extended/full permissions, including
      contents:write). Fails if neither is available.
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            step_version="$(grep -m1 '^version:' step.yml | awk '{print $2}')"
            if [ -z "$step_version" ]; then
              step_version="${BITRISE_STEP_VERSION}"
            fi
            if [ -z "$step_version" ]; then
              echo "Could not read version from step.yml or BITRISE_STEP_VERSION!"
              exit 1
            fi
            release_body="$(cat RELEASE_NOTES.md 2>/dev/null || echo "Release of ${step_version}")"
            gh_token="${GITHUB_TOKEN:-${GIT_HTTP_PASSWORD}}"
            if [ -z "$gh_token" ]; then
              echo "No GitHub token found! Set GITHUB_TOKEN or rely on the Bitrise GitHub App token in GIT_HTTP_PASSWORD."
              exit 1
            fi
            GITHUB_TOKEN="${gh_token}" STEP_VERSION="${step_version}" RELEASE_BODY="${release_body}" python3 <<'PYEOF_INNER'
            import json
            import os
            import urllib.error
            import urllib.request

            token = os.environ["GITHUB_TOKEN"]
            version = os.environ["STEP_VERSION"]
            body = os.environ["RELEASE_BODY"]
            repo_slug = os.popen("git remote get-url origin | sed 's#.*github.com[:/]##;s#\.git$##'").read().strip()

            req = urllib.request.Request(
                f"https://api.github.com/repos/{repo_slug}/releases/tags/{version}",
                headers={"Authorization": f"token {token}"},
            )
            try:
                urllib.request.urlopen(req)
                print(f"Release for {version} already exists, skipping creation.")
                raise SystemExit(0)
            except urllib.error.HTTPError as e:
                if e.code != 404:
                    raise

            payload = json.dumps({
                "tag_name": version,
                "name": version,
                "body": body,
                "draft": False,
                "prerelease": False,
            }).encode()
            req = urllib.request.Request(
                f"https://api.github.com/repos/{repo_slug}/releases",
                data=payload,
                headers={"Authorization": f"token {token}", "Content-Type": "application/json"},
                method="POST",
            )
            with urllib.request.urlopen(req) as resp:
                print(f"Created GitHub release {version}: {resp.status}")
            PYEOF_INNER

  # ----------------------------------------------------------------
  # --- one-call release flow: audit -> test -> tag -> GitHub release -> share
  release-this-step:
    description: |-
      One-call release flow for this step. Runs `audit-this-step`, `test`,
      `tag-this-step`, `github-release-this-step` and `share-this-step` in
      order, using the version from `step.yml` as the single source of truth.

      Setup:

      - Bump `version:` in `step.yml` and commit.
      - Provide a `GITHUB_TOKEN` (GitHub access token with `repo` scope) in
        `.bitrise.secrets.yml`, for the tag push and the GitHub release.
      - Optionally add a `RELEASE_NOTES.md` to the repo root; its content
        becomes the GitHub release body.

      Then run: $ bitrise run release-this-step

      After the share process finishes, open a Pull Request in the
      official Bitrise StepLib repository as described in the guide
      printed at the end of the process.
    before_run:
    - audit-this-step
    - test
    - tag-this-step
    - github-release-this-step
    - share-this-step

  share-this-step:
    envs:
      # if you want to share this step into a StepLib
      - MY_STEPLIB_REPO_FORK_GIT_URL: $MY_STEPLIB_REPO_FORK_GIT_URL
      - BITRISE_STEP_ID: $BITRISE_STEP_ID
      - BITRISE_STEP_VERSION: $BITRISE_STEP_VERSION
      - BITRISE_STEP_GIT_CLONE_URL: $BITRISE_STEP_GIT_CLONE_URL
    description: |-
      If this is the first time you try to share a Step you should
      first call: $ bitrise share

      This will print you a guide, and information about how Step sharing
      works. Please read it at least once!

      As noted in the Step sharing guide you'll have to fork the
      StepLib you want to share this step into. Once you're done with forking
      the repository you should set your own fork's git clone URL
      in the `.bitrise.secrets.yml` file, or here in the `envs` section,
      as the value of the `MY_STEPLIB_REPO_FORK_GIT_URL` environment.

      You're now ready to share this Step, just make sure that
      the `BITRISE_STEP_ID` and `BITRISE_STEP_VERSION`
      environments are set to the desired values!

      To share this Step into a StepLib you can just run: $ bitrise run share-this-step

      Once it finishes the only thing left is to actually create a Pull Request,
      the way described in the guide printed at the end of the process.
    before_run:
    - audit-this-step
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            bitrise share start -c "${MY_STEPLIB_REPO_FORK_GIT_URL}"
            bitrise share create --stepid "${BITRISE_STEP_ID}" --tag "${BITRISE_STEP_VERSION}" --git "${BITRISE_STEP_GIT_CLONE_URL}"
            bitrise share finish
