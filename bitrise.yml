format_version: '6'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other

workflows:
  # CI entry point for bitrise.io: clones the repo, then runs the
  # local step test against the cloned source. When the Bitrise app
  # uses the dashboard-stored config, this clone is the only way the
  # step code reaches the build machine.
  ci:
    steps:
    - activate-ssh-key:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone: {}
    after_run:
    - lint-and-test
    - test
    - deploy-test-artifacts
    triggers:
      push:
      - branch: main
      pull_request:
      - source_branch: "*"

  # Deploy the stamped test icons as build artifacts on bitrise.io,
  # so the stamp result can be verified in the build summary. Also
  # stamps a second variant with a custom template and north position
  # to exercise the new inputs in CI. Skipped in local runs (no
  # bitrise.io build to attach artifacts to).
  deploy-test-artifacts:
    steps:
    - script:
        title: Stamp a second icon variant with custom template and position
        run_if: .IsCI
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            # cwd is still ./testing (set by change-workdir in the test workflow)
            rm -rf ./AppIcon-custom
            mkdir -p ./AppIcon-custom
            cp ./AppIcon/*.png ./AppIcon-custom/
    - path::$BITRISE_SOURCE_DIR:
        title: Step Test (custom template)
        description: |-
          Stamps a copy of the test icon with a custom text template,
          north banner position, and custom colors, to verify the
          newer inputs in CI.
        run_if: .IsCI
        inputs:
        - stamp_path_to_icons: "./AppIcon-custom"
        - stamp_version: "1.2"
        - stamp_build_number: "123"
        - stamp_text: "DEV %version% (%build%)"
        - stamp_position: "north"
        - background_color: "#333333CC"
    - script:
        title: Copy stamped test icons to deploy dir
        run_if: .IsCI
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            # cwd is still ./testing (set by change-workdir in the test workflow)
            mkdir -p "${BITRISE_DEPLOY_DIR}/stamped-icons"
            cp ./AppIcon/*.png "${BITRISE_DEPLOY_DIR}/stamped-icons/"
            mkdir -p "${BITRISE_DEPLOY_DIR}/stamped-icons-custom"
            cp ./AppIcon-custom/*.png "${BITRISE_DEPLOY_DIR}/stamped-icons-custom/"
    - deploy-to-bitrise-io:
        run_if: .IsCI
        inputs:
        - deploy_path: ${BITRISE_DEPLOY_DIR}/stamped-icons
        - is_compress: false
        - notify_user_groups: ""
    - deploy-to-bitrise-io:
        title: Deploy stamped custom icons to bitrise.io
        run_if: .IsCI
        inputs:
        - deploy_path: ${BITRISE_DEPLOY_DIR}/stamped-icons-custom
        - is_compress: false
        - notify_user_groups: ""
    after_run:
    - annotate-build

  # Static checks and unit tests of the step's Go code: build, vet,
  # gofmt verification, and `go test`. Runs on every CI build (push
  # and pull request) and can also be run locally.
  lint-and-test:
    steps:
    - script:
        title: Go build, vet, gofmt check, and unit tests
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            go build ./...
            go vet ./...
            test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
            go test ./... -v

  # Add a build annotation pointing at the stamped-icon verification
  # artifacts, so the stamp result can be checked directly on the
  # build details page without any token configuration. Uses the
  # built-in Bitrise annotations plugin; skipped in local runs (no
  # bitrise.io build to annotate).
  annotate-build:
    steps:
    - script:
        title: Annotate build with stamped-icon verification info
        run_if: .IsCI
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            bitrise plugin install https://github.com/bitrise-io/bitrise-plugins-annotations.git
            bitrise :annotations annotate "**Stamped icons are ready to verify.**

            This build stamped the sample icons with the step's default format and with a custom template:

            - Default stamp (\`- 1.2(123)\`): **stamped-icons** artifact on the [Artifacts tab](${BITRISE_BUILD_URL}?tab=artifacts)
            - Custom stamp (\`DEV 1.2 (123)\`, north banner): **stamped-icons-custom** artifact

            Download the artifacts to visually confirm the stamp rendering before merging." --style info

  # Local step test: run with `bitrise run test` from the repo root.
  test:
    steps:
    - change-workdir:
        title: Switch working dir to test / testing dir
        description: |-
          To prevent step testing issues, like referencing relative
          files with just './some-file' in the step's code, which would
          work for testing the step from this directory directly
          but would break if the step is included in another `bitrise.yml`.
        run_if: true
        inputs:
        - path: ./testing
        - is_create_path: true
    - path::$BITRISE_SOURCE_DIR:
        title: Step Test
        description: |-
          Stamp test icon with version 1.2(123) with default colors.
        run_if: true
        inputs:
        - stamp_path_to_icons: "./AppIcon"
        - stamp_version: "1.2"
        - stamp_build_number: "123"

  # ----------------------------------------------------------------
  # --- workflows to Share this step into a Step Library
  audit-this-step:
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            stepman audit --step-yml ./step.yml

  # ----------------------------------------------------------------
  # --- workflow to tag a release with the step version
  tag-this-step:
    description: |-
      Tags the current commit with the version in `step.yml` and pushes
      the tag to origin.

      Meant to run locally with the Bitrise CLI. Requires the `gh` CLI
      to be installed and signed in (`gh auth login`); the tag push
      uses your existing git credentials for origin.
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            step_version="$(grep -m1 '^version:' step.yml | awk '{print $2}')"
            if [ -z "$step_version" ]; then
              step_version="${BITRISE_STEP_VERSION}"
            fi
            if [ -z "$step_version" ]; then
              echo "Could not read version from step.yml or BITRISE_STEP_VERSION!"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${step_version}" >/dev/null; then
              if [ "$(git rev-parse HEAD)" = "$(git rev-parse "${step_version}^{commit}")" ]; then
                echo "Tag ${step_version} already exists on this commit, skipping tagging."
                exit 0
              else
                echo "Tag ${step_version} already exists on a different commit!"
                exit 1
              fi
            fi
            echo "Tagging release: ${step_version}"
            gh auth status
            git tag -a "${step_version}" -m "Release ${step_version}"
            git push origin "${step_version}"

  # ----------------------------------------------------------------
  # --- workflow to create a GitHub release for the step version tag
  github-release-this-step:
    description: |-
      Creates a GitHub release for the tag matching the version in
      `step.yml`, with notes from `RELEASE_NOTES.md`. Skips creation
      if the release already exists.

      Meant to run locally with the Bitrise CLI. Requires the `gh` CLI
      to be installed and signed in (`gh auth login`).
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            step_version="$(grep -m1 '^version:' step.yml | awk '{print $2}')"
            if [ -z "$step_version" ]; then
              step_version="${BITRISE_STEP_VERSION}"
            fi
            if [ -z "$step_version" ]; then
              echo "Could not read version from step.yml or BITRISE_STEP_VERSION!"
              exit 1
            fi
            gh auth status
            if gh release view "${step_version}" >/dev/null 2>&1; then
              echo "Release for ${step_version} already exists, skipping creation."
              exit 0
            fi
            notes_file="$(mktemp)"
            if [ -f RELEASE_NOTES.md ]; then
              cp RELEASE_NOTES.md "${notes_file}"
            else
              echo "Release of ${step_version}" > "${notes_file}"
            fi
            gh release create "${step_version}" --title "${step_version}" --notes-file "${notes_file}" --verify-tag
            rm -f "${notes_file}"

  # ----------------------------------------------------------------
  # --- one-call release flow: audit -> test -> tag -> GitHub release -> share
  release-this-step:
    description: |-
      One-call release flow for this step, meant to be run locally
      with the Bitrise CLI. Runs `audit-this-step`, `test`,
      `tag-this-step`, `github-release-this-step` and `share-this-step`
      in order, using the version from `step.yml` as the single source
      of truth.

      Setup:

      - Install the `gh` CLI and sign in with `gh auth login`.
      - Bump `version:` in `step.yml` and commit.
      - Optionally add or update `RELEASE_NOTES.md` in the repo root;
        its content becomes the GitHub release body.

      Then run: $ bitrise run release-this-step

      After the share process finishes, open a Pull Request in the
      official Bitrise StepLib repository as described in the guide
      printed at the end of the process.
    before_run:
    - audit-this-step
    - test
    - tag-this-step
    - github-release-this-step
    - share-this-step

  share-this-step:
    envs:
    - MY_STEPLIB_REPO_FORK_GIT_URL: https://github.com/ollitapa/bitrise-steplib
    - BITRISE_STEP_ID: bitrise-step-stamp-appicon-with-version-number
    - BITRISE_STEP_VERSION: "1.2.0"
    - BITRISE_STEP_GIT_CLONE_URL: https://github.com/ollitapa/bitrise-step-stamp-appicon-with-version-number.git
    description: |-
      If this is the first time you try to share a Step you should
      first call: $ bitrise share

      This will print you a guide, and information about how Step sharing
      works. Please read it at least once!

      As noted in the Step sharing guide you'll have to fork the
      StepLib you want to share this step into. Once you're done with forking
      the repository you should set your own fork's git clone URL
      in the `.bitrise.secrets.yml` file, or here in the `envs` section,
      as the value of the `MY_STEPLIB_REPO_FORK_GIT_URL` environment.

      You're now ready to share this Step, just make sure that the
      `BITRISE_STEP_ID` and `BITRISE_STEP_VERSION`
      environments are set to the desired values!

      To share this Step into a StepLib you can just run: $ bitrise run share-this-step

      Once it finishes the only thing left is to actually create a Pull Request,
      the way described in the guide printed at the end of the process.
    before_run:
    - audit-this-step
    steps:
    - script:
        inputs:
        - content: |-
            #!/bin/bash
            set -ex
            bitrise share start -c "${MY_STEPLIB_REPO_FORK_GIT_URL}"
            bitrise share create --stepid "${BITRISE_STEP_ID}" --tag "${BITRISE_STEP_VERSION}" --git "${BITRISE_STEP_GIT_CLONE_URL}"
            bitrise share finish

meta:
  bitrise.io:
    stack: osx-xcode-latest-stable
